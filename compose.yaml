services:
  bridge:
    build: .
    ports:
      - "8000:8000"
    environment:
      BRIDGE_MQTT_ENABLED: "true"
      BRIDGE_MQTT_HOST: mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
